services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tndc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tndc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    container_name: tndc-api
    restart: unless-stopped
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER must be set in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8001}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-1}
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-true}
      SIMILAR_SOURCE: ${SIMILAR_SOURCE:-cbf}
      SEARCH_RRF_K: ${SEARCH_RRF_K:-60}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app

  # Periodic jobs: expire stale Pending orders (stock reserve TTL) and RODO event retention.
  jobs:
    build: ./api
    container_name: tndc-jobs
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
    # shortcut: shell loop instead of cron, one 5-min cadence for both; move to a scheduler if cadences diverge
    command: >
      sh -c 'while true;
             do python -m scripts.expire_pending_orders;
                python -m scripts.anonymize_events;
                python -m scripts.build_embeddings;
                sleep 300; done'

  # Text embeddings (multilingual-e5-small, 384 dims). The api does not depend_on it:
  # search falls back to lexical-only when the embedder is down.
  embedder:
    build: ./embedder
    container_name: tndc-embedder
    restart: unless-stopped
    environment:
      HF_HOME: /models
    ports:
      - "8001:8001"
    volumes:
      - tndc_hf_cache:/models
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tndc-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  tndc_pgdata:
  tndc_hf_cache:
